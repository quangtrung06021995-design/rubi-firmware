<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Rubi - Xem từ xa</title>
<meta name="theme-color" content="#14202b">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#14202b;color:#e8f0f7;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:680px;padding:14px}
h1{font-size:18px;margin:6px 0 12px}
.screen{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.screen img{width:100%;height:100%;object-fit:contain;display:none}
.msg{white-space:pre-line;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#9fb3c4;font-size:15px}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:#2f7de1;color:#fff}
button.g{background:#2a3b4b}
button:disabled{opacity:.5}
.st{margin-top:10px;font-size:13px;color:#9fb3c4}
.box{background:#1d2d3b;border-radius:14px;padding:16px;margin-top:12px}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid #3a4f63;background:#14202b;color:#fff;margin:8px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-right:6px}
.dot.on{background:#3fcf6e}
</style>
</head>
<body>
<div class="wrap">
 <h1>Rubi · Xem từ xa</h1>

 <div class="box" id="setup" hidden>
  <div>Nhập <b>khóa từ xa</b> (đã cài trên trang camera, 10-40 chữ và số):</div>
  <input id="key" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Khóa từ xa">
  <button id="ok">Lưu và xem</button>
  <div class="st">Khóa chỉ lưu trên điện thoại này. Đừng gửi khóa cho ai.</div>
 </div>

 <div id="viewer" hidden>
  <div class="screen"><img id="img" alt="Hình từ camera Rubi"><div class="msg" id="msg">Đang kết nối...</div></div>
  <div class="bar">
   <button id="snap" class="g">Chụp ảnh</button>
   <button id="full" class="g">Toàn màn hình</button>
   <button id="pause" class="g">Tạm dừng</button>
   <button id="chg" class="g">Đổi khóa</button>
  </div>
  <div class="st"><span class="dot" id="dot"></span><span id="st">...</span></div>
  <div class="st" id="info"></div>
 </div>
</div>

<script>
(function(){
"use strict";
var CFG_URL="https://raw.githubusercontent.com/quangtrung06021995-design/rubi-firmware/relay-cfg/relay.json";
var $=function(i){return document.getElementById(i)};
var host=null,ws=null,key="",paused=false,retry=0,timer=null,lastUrl=null,frames=0,fpsT=Date.now(),dead=false,lastMsg=0,beat=null;
function store(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}
function say(t){$("msg").textContent=t;$("msg").style.display="flex";$("img").style.display="none"}
function status(t,on){$("st").textContent=t;$("dot").className="dot"+(on?" on":"")}

function getHost(){
  if(host)return Promise.resolve(host);
  return fetch(CFG_URL+"?_="+Math.floor(Date.now()/60000),{cache:"no-store"}).then(function(r){
    if(!r.ok)throw new Error("cfg");return r.json();
  }).then(function(j){
    if(!j||!/^[A-Za-z0-9.-]+$/.test(j.host||""))throw new Error("cfg");
    host=j.host;return host;
  });
}

function connect(){
  clearTimeout(timer);
  if(dead||document.hidden){return}
  getHost().then(function(h){
    var s=new WebSocket("wss://"+h+"/ws?role=view&k="+encodeURIComponent(key));
    s.binaryType="blob";
    ws=s;
    s.onopen=function(){retry=0;lastMsg=Date.now();status("Đã nối máy chủ, đang chờ camera...",false)};
    s.onmessage=function(e){
      lastMsg=Date.now();
      if(typeof e.data==="string"){
        var j;try{j=JSON.parse(e.data)}catch(x){return}
        if(j.t==="s"){
          if(!j.cam){say("Camera Rubi chưa kết nối ra mạng.\nKiểm tra Rubi đã bật nguồn, có Wi-Fi và đã cài khóa từ xa.");status("Camera ngoại tuyến",false)}
          else{status("Camera đã kết nối · "+j.n+" người đang xem",true);if(!frames)say("Camera đã kết nối, đang chờ hình...")}
        }
        return;
      }
      if(paused)return;
      var u=URL.createObjectURL(new Blob([e.data],{type:"image/jpeg"}));
      var im=$("img");
      im.onload=function(){if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=u};
      im.src=u;im.style.display="block";$("msg").style.display="none";
      frames++;
      var n=Date.now();
      if(n-fpsT>=2000){$("info").textContent=(frames*1000/(n-fpsT)).toFixed(1)+" hình/giây · "+Math.round(e.data.size/1024)+" KB/hình";frames=0;fpsT=n}
    };
    s.onclose=function(ev){
      if(ws!==s)return;
      ws=null;frames=0;
      if(ev&&ev.code===1000&&ev.reason==="busy"){}
      status("Mất kết nối, thử lại...",false);
      retry=Math.min(retry+1,6);
      timer=setTimeout(connect,Math.min(1000*retry*retry,20000));
    };
    s.onerror=function(){try{s.close()}catch(x){}};
  }).catch(function(){
    say("Chưa tìm thấy máy chủ trung gian.\nNếu mới cài, đợi vài phút rồi thử lại.");
    status("Chưa có địa chỉ máy chủ",false);
    retry=Math.min(retry+1,6);
    timer=setTimeout(connect,Math.min(3000*retry,20000));
  });
}

// Heartbeat: say "h" every 15 s (the relay answers with the state). 40 s of silence = dead link: reconnect.
clearInterval(beat);
beat=setInterval(function(){
  if(!ws||document.hidden)return;
  if(Date.now()-lastMsg>40000){var s=ws;ws=null;try{s.close()}catch(x){}frames=0;retry=0;status("Mất kết nối, thử lại...",false);connect();return}
  if(ws.readyState===1){try{ws.send("h")}catch(x){}}
},15000);

function stop(){clearTimeout(timer);if(ws){var s=ws;ws=null;try{s.close(1000,"bye")}catch(x){}}}

function start(){
  $("setup").hidden=true;$("viewer").hidden=false;
  say("Đang kết nối...");status("Đang kết nối...",false);
  stop();retry=0;connect();
}

function ask(){stop();$("viewer").hidden=true;$("setup").hidden=false;$("key").value="";$("key").focus()}

$("ok").onclick=function(){
  var k=$("key").value.trim();
  if(!/^[A-Za-z0-9]{10,40}$/.test(k)){alert("Khóa phải dài 10-40 ký tự, chỉ gồm chữ và số.");return}
  key=k;store("rubi_rkey",k);start();
};
$("key").onkeydown=function(e){if(e.key==="Enter")$("ok").onclick()};
$("chg").onclick=function(){store("rubi_rkey",null);ask()};
$("pause").onclick=function(){paused=!paused;$("pause").textContent=paused?"Tiếp tục":"Tạm dừng"};
$("full").onclick=function(){var el=document.querySelector(".screen");(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el)};
$("snap").onclick=function(){
  var im=$("img");if(!im.src||im.style.display==="none")return;
  var c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;
  c.getContext("2d").drawImage(im,0,0);
  c.toBlob(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);
    a.download="rubi-"+new Date().toISOString().replace(/[:.]/g,"-")+".jpg";a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href)},2000)},"image/jpeg",0.92);
};
// Save data and the camera's battery: stop watching when the page is hidden, resume when it comes back.
document.addEventListener("visibilitychange",function(){
  if(!key)return;
  if(document.hidden){stop()}else{retry=0;connect()}
});
addEventListener("pagehide",function(){dead=true;stop()});
addEventListener("pageshow",function(e){if(e.persisted&&key){dead=false;retry=0;connect()}});

key=load("rubi_rkey");
var q=(location.hash||"").replace(/^#k=/,"");
if(/^[A-Za-z0-9]{10,40}$/.test(q)){key=q;store("rubi_rkey",q);history.replaceState(null,"",location.pathname)}
if(key)start();else ask();
})();
</script>
</body>
</html>
