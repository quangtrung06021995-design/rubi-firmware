name: Build Rubi firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - overlay/**
      - UPSTREAM_COMMIT
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout Rubi repo
        uses: actions/checkout@v4

      - name: Get upstream Xiaozhi source
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git clone https://github.com/78/xiaozhi-esp32.git upstream
          git -C upstream checkout "$(cat UPSTREAM_COMMIT)"
          cp -r overlay/. upstream/

      - name: Keep custom wake word (build.py forces default wake word otherwise)
        shell: bash
        working-directory: upstream
        run: |
          python3 - <<'PY'
          p = 'scripts/build.py'
          s = open(p, encoding='utf-8').read()
          anchor = '        validation_symbols.append((wake_word_symbols, "--wake-word"))\n'
          assert s.count(anchor) == 1, 'anchor not found'
          patch = anchor + (
              '        user_options[:] = [o for o in user_options if not o.startswith((\n'
              '            "CONFIG_USE_AFE_WAKE_WORD", "CONFIG_USE_ESP_WAKE_WORD",\n'
              '            "CONFIG_USE_CUSTOM_WAKE_WORD", "CONFIG_SR_WN_"))]\n'
              '        user_options.append("CONFIG_USE_CUSTOM_WAKE_WORD=y")\n'
              '        validation_symbols[-1] = (["CONFIG_USE_CUSTOM_WAKE_WORD"], "--wake-word")\n'
          )
          open(p, 'w', encoding='utf-8').write(s.replace(anchor, patch))
          PY
          grep -n "CONFIG_USE_CUSTOM_WAKE_WORD=y" scripts/build.py

      - name: Install Rubi face (13 expressions)
        shell: bash
        working-directory: upstream
        run: |
          B=main/boards/freenove-esp32s3-display-2.8-lcd/freenove-esp32s3-display-2.8-lcd.cc
          grep -c 'new SpiLcdDisplay(' "$B"
          sed -i 's|#include "display/lcd_display.h"|#include "display/lcd_display.h"\n#include "display/rubi_face.h"|' "$B"
          sed -i 's|new SpiLcdDisplay(|new RubiDisplay(|' "$B"
          grep -n "rubi_face\|RubiDisplay" "$B"

      - name: Stamp version and OTA address
        shell: bash
        working-directory: upstream
        env:
          OTA_URL_VAR: ${{ vars.OTA_URL || 'https://rubi-firmware.vercel.app/api/ota' }}
        run: |
          VER="3.0.${{ github.run_number }}"
          sed -i "s/set(PROJECT_VER \"[^\"]*\")/set(PROJECT_VER \"$VER\")/" CMakeLists.txt
          grep -n "PROJECT_VER" CMakeLists.txt
          echo "RUBI_VERSION=$VER" >> "$GITHUB_ENV"
          if [ -n "$OTA_URL_VAR" ]; then
            python3 - <<'PY'
          import json, os
          p = 'main/boards/freenove-esp32s3-display-2.8-lcd/config.json'
          c = json.load(open(p, encoding='utf-8'))
          c['builds'][0]['sdkconfig_append'].append('CONFIG_OTA_URL="%s"' % os.environ['OTA_URL_VAR'])
          json.dump(c, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=4)
          PY
            echo "OTA address set to $OTA_URL_VAR"
          else
            echo "OTA_URL variable not set: using the default server"
          fi

      - name: Build
        shell: bash
        working-directory: upstream
        run: |
          set -o pipefail
          source "$IDF_PATH/export.sh"
          python scripts/build.py freenove-esp32s3-display-2.8-lcd --name rubi --language vi-VN 2>&1 | tee ../build.log

      - name: Publish build log (branch build-log)
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          mkdir -p /tmp/logpub && cd /tmp/logpub && rm -rf .git
          { echo "run ${{ github.run_number }} sha ${{ github.sha }}"; tail -n 300 "$GITHUB_WORKSPACE/build.log" 2>/dev/null; } > build.log.txt
          git init -q && git checkout -q -b build-log
          git add . && git -c user.name=rubi-ci -c user.email=ci@rubi.local commit -q -m "build log"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-log || true

      - name: Publish OTA files (branch ota)
        shell: bash
        run: |
          mkdir -p /tmp/otapub && cd /tmp/otapub && rm -rf .git
          cp "$GITHUB_WORKSPACE/upstream/build/xiaozhi.bin" rubi.bin
          printf '{"version":"%s","url":"https://raw.githubusercontent.com/%s/ota/rubi.bin"}\n' "$RUBI_VERSION" "${{ github.repository }}" > manifest.json
          cat manifest.json; ls -la
          git init -q && git checkout -q -b ota
          git add . && git -c user.name=rubi-ci -c user.email=ci@rubi.local commit -q -m "OTA $RUBI_VERSION"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ota

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: rubi-firmware
          path: upstream/build/merged-binary.bin
          if-no-files-found: error
