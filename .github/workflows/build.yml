name: Build Rubi firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - overlay/**
      - patches/**
      - icons/**
      - UPSTREAM_COMMIT
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout Rubi repo
        uses: actions/checkout@v4

      - name: Get upstream Xiaozhi source
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git clone https://github.com/78/xiaozhi-esp32.git upstream
          git -C upstream checkout "$(cat UPSTREAM_COMMIT)"
          cp -r overlay/. upstream/

      - name: Keep custom wake word (build.py forces default wake word otherwise)
        shell: bash
        working-directory: upstream
        run: |
          python3 - <<'PY'
          p = 'scripts/build.py'
          s = open(p, encoding='utf-8').read()
          anchor = '        validation_symbols.append((wake_word_symbols, "--wake-word"))\n'
          assert s.count(anchor) == 1, 'anchor not found'
          patch = anchor + (
              '        user_options[:] = [o for o in user_options if not o.startswith((\n'
              '            "CONFIG_USE_AFE_WAKE_WORD", "CONFIG_USE_ESP_WAKE_WORD",\n'
              '            "CONFIG_USE_CUSTOM_WAKE_WORD", "CONFIG_SR_WN_"))]\n'
              '        user_options.append("CONFIG_USE_CUSTOM_WAKE_WORD=y")\n'
              '        validation_symbols[-1] = (["CONFIG_USE_CUSTOM_WAKE_WORD"], "--wake-word")\n'
          )
          open(p, 'w', encoding='utf-8').write(s.replace(anchor, patch))
          PY
          grep -n "CONFIG_USE_CUSTOM_WAKE_WORD=y" scripts/build.py

      - name: Wake word pronunciation variants (hei/hai, ru/lu bi)
        shell: bash
        working-directory: upstream
        run: |
          # The device reads the wake phrases from index.json inside the assets
          # partition (not from the C++ code), so the variants go there.
          python3 - <<'PY'
          p = 'scripts/build_default_assets.py'
          s = open(p, encoding='utf-8').read()
          anchor = "        print(f\"  custom wake word: {custom_wake_word_config['wake_word']} ({custom_wake_word_config['display']})\")\n"
          assert s.count(anchor) == 1, 'anchor not found'
          extra = (
              "        for _v in ('hai ru bi', 'hei lu bi', 'hai lu bi', 'hei ru bei', 'ru bi ei'):\n"
              "            multinet_model_info['commands'].append({'command': _v, 'text': custom_wake_word_config['display'], 'action': 'wake'})\n"
              "        print('  wake word variants:', [c['command'] for c in multinet_model_info['commands']])\n"
          )
          open(p, 'w', encoding='utf-8').write(s.replace(anchor, extra + anchor))
          PY
          grep -n "wake word variants" scripts/build_default_assets.py

      - name: Keep Rubi assets (ignore server-pushed assets that replace the wake word)
        shell: bash
        working-directory: upstream
        run: |
          python3 - <<'PY'
          p = 'main/application.cc'
          s = open(p, encoding='utf-8').read()
          old = '    std::string download_url = settings.GetString("download_url");\n'
          assert s.count(old) == 1, 'anchor not found'
          new = '    std::string download_url;\n    settings.EraseKey("download_url");\n'
          open(p, 'w', encoding='utf-8').write(s.replace(old, new))
          PY
          grep -n 'settings.EraseKey("download_url")' main/application.cc

      - name: Microphone gain 30 dB (test, 42 dB amplified the amplifier noise with the speaker plugged in)
        shell: bash
        working-directory: upstream
        run: |
          python3 - <<'PY'
          p = 'main/audio/codecs/es8311_audio_codec.cc'
          s = open(p, encoding='utf-8').read()
          old = '    input_gain_ = 30;\n'
          assert s.count(old) == 1, 'anchor not found'
          open(p, 'w', encoding='utf-8').write(s.replace(old, '    input_gain_ = 30;\n'))
          PY
          grep -n "input_gain_ = 30" main/audio/codecs/es8311_audio_codec.cc

      - name: Reboot watchdog (force a hardware reset if the normal reboot hangs after OTA)
        shell: bash
        working-directory: upstream
        run: |
          python3 - <<'PY'
          p = 'main/application.cc'
          s = open(p, encoding='utf-8').read()
          inc = '#include <esp_log.h>\n'
          assert s.count(inc) == 1, 'include anchor not found'
          s = s.replace(inc, inc + '#include <esp_timer.h>\n#include <esp_rom_sys.h>\n')
          old = '    ESP_LOGI(TAG, "Rebooting...");\n'
          assert s.count(old) == 1, 'reboot anchor not found'
          new = old + (
              '    {\n'
              '        // Independent of every app task: if anything below blocks, hard-reset after 5 s.\n'
              '        static esp_timer_handle_t reboot_wd = nullptr;\n'
              '        if (reboot_wd == nullptr) {\n'
              '            esp_timer_create_args_t wd_args = {};\n'
              '            wd_args.callback = [](void*) { esp_rom_software_reset_system(); };\n'
              '            wd_args.name = "reboot_wd";\n'
              '            if (esp_timer_create(&wd_args, &reboot_wd) == ESP_OK) {\n'
              '                esp_timer_start_once(reboot_wd, 5000000);\n'
              '            }\n'
              '        }\n'
              '    }\n')
          open(p, 'w', encoding='utf-8').write(s.replace(old, new))
          PY
          grep -n "reboot_wd" main/application.cc | head -3

      - name: Microphone filters (hum and whine)
        shell: bash
        working-directory: upstream
        run: |
          python3 - <<'PY'
          p = 'main/audio/codecs/es8311_audio_codec.cc'
          s = open(p, encoding='utf-8').read()
          inc = '#include "es8311_audio_codec.h"\n'
          assert s.count(inc) == 1
          old = ('int Es8311AudioCodec::Read(int16_t* dest, int samples) {\n'
                 '    if (input_enabled_) {\n'
                 '        ESP_ERROR_CHECK_WITHOUT_ABORT(esp_codec_dev_read(dev_, (void*)dest, samples * sizeof(int16_t)));\n'
                 '    }\n'
                 '    return samples;\n'
                 '}\n')
          assert s.count(old) == 1
          helpers = open('../patches/mic_filter_helpers.txt', encoding='utf-8').read()
          newread = open('../patches/mic_filter_read.txt', encoding='utf-8').read()
          s = s.replace(inc, inc + '\n' + helpers, 1).replace(old, newread, 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "RubiBiquad\|g_filters_ready" main/audio/codecs/es8311_audio_codec.cc | head

      - name: Install Rubi face (13 expressions)
        shell: bash
        working-directory: upstream
        run: |
          B=main/boards/freenove-esp32s3-display-2.8-lcd/freenove-esp32s3-display-2.8-lcd.cc
          grep -c 'new SpiLcdDisplay(' "$B"
          sed -i 's|#include "display/lcd_display.h"|#include "display/lcd_display.h"\n#include "display/rubi_face.h"|' "$B"
          sed -i 's|new SpiLcdDisplay(|new RubiDisplay(|' "$B"
          grep -n "rubi_face\|RubiDisplay" "$B"

      - name: Weather tool (current location)
        shell: bash
        working-directory: upstream
        run: |
          python3 - <<'PY'
          p = 'main/boards/freenove-esp32s3-display-2.8-lcd/freenove-esp32s3-display-2.8-lcd.cc'
          s = open(p, encoding='utf-8').read()
          anchor = "    void InitializeTools() {\n    }"
          assert s.count(anchor) == 1
          s = s.replace(anchor, open('../patches/weather_tool.txt', encoding='utf-8').read().rstrip('\n'))
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Touch menu and music player (SD card)
        shell: bash
        working-directory: upstream
        run: |
          python3 ../patches/apply_media.py

      - name: Spoken music commands (speech-to-text hook)
        shell: bash
        working-directory: upstream
        run: |
          python3 - <<'PY'
          p = 'main/application.cc'
          s = open(p, encoding='utf-8').read()
          old = '                ESP_LOGI(TAG, ">> %s", text->valuestring);\n'
          assert s.count(old) == 1, 'stt anchor not found'
          s = s.replace(old, old + '                rubi_handle_speech(text->valuestring);\n')
          inc = '#include "application.h"\n'
          assert s.count(inc) == 1, 'include anchor not found'
          s = s.replace(inc, inc + 'void rubi_handle_speech(const char* text);  // defined in the board file\n')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "rubi_handle_speech" main/application.cc

      - name: Stamp version and OTA address
        shell: bash
        working-directory: upstream
        env:
          OTA_URL_VAR: ${{ vars.OTA_URL || 'https://rubi-firmware.vercel.app/api/ota' }}
        run: |
          VER="3.0.${{ github.run_number }}"
          sed -i "s/set(PROJECT_VER \"[^\"]*\")/set(PROJECT_VER \"$VER\")/" CMakeLists.txt
          grep -n "PROJECT_VER" CMakeLists.txt
          echo "RUBI_VERSION=$VER" >> "$GITHUB_ENV"
          if [ -n "$OTA_URL_VAR" ]; then
            python3 - <<'PY'
          import json, os
          p = 'main/boards/freenove-esp32s3-display-2.8-lcd/config.json'
          c = json.load(open(p, encoding='utf-8'))
          c['builds'][0]['sdkconfig_append'].append('CONFIG_OTA_URL="%s"' % os.environ['OTA_URL_VAR'])
          json.dump(c, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=4)
          PY
            echo "OTA address set to $OTA_URL_VAR"
          else
            echo "OTA_URL variable not set: using the default server"
          fi

      - name: Build
        shell: bash
        working-directory: upstream
        run: |
          set -o pipefail
          source "$IDF_PATH/export.sh"
          python scripts/build.py freenove-esp32s3-display-2.8-lcd --name rubi --language vi-VN 2>&1 | tee ../build.log

      - name: Publish build log (branch build-log)
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          mkdir -p /tmp/logpub && cd /tmp/logpub && rm -rf .git
          { echo "run ${{ github.run_number }} sha ${{ github.sha }}"; tail -n 300 "$GITHUB_WORKSPACE/build.log" 2>/dev/null; } > build.log.txt
          git init -q && git checkout -q -b build-log
          git add . && git -c user.name=rubi-ci -c user.email=ci@rubi.local commit -q -m "build log"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-log || true

      - name: Publish OTA files (branch ota)
        shell: bash
        run: |
          mkdir -p /tmp/otapub && cd /tmp/otapub && rm -rf .git
          cp "$GITHUB_WORKSPACE/upstream/build/xiaozhi.bin" rubi.bin
          printf '{"version":"%s","url":"https://raw.githubusercontent.com/%s/ota/rubi.bin"}\n' "$RUBI_VERSION" "${{ github.repository }}" > manifest.json
          cat manifest.json; ls -la
          git init -q && git checkout -q -b ota
          git add . && git -c user.name=rubi-ci -c user.email=ci@rubi.local commit -q -m "OTA $RUBI_VERSION"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ota

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: rubi-firmware
          path: upstream/build/merged-binary.bin
          if-no-files-found: error
