name: Build Rubi mic-test firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mictest/**
      - UPSTREAM_COMMIT
      - .github/workflows/mictest.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Get upstream source and swap in the mic test
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git clone https://github.com/78/xiaozhi-esp32.git upstream
          git -C upstream checkout "$(cat UPSTREAM_COMMIT)"
          cp -r overlay/. upstream/
          cp mictest/main.cc upstream/main/main.cc
      - name: Build
        shell: bash
        working-directory: upstream
        run: |
          set -o pipefail
          source "$IDF_PATH/export.sh"
          python scripts/build.py freenove-esp32s3-display-2.8-lcd --name rubi --language vi-VN 2>&1 | tee ../mictest.log
      - name: Publish build log
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/logpub && cd /tmp/logpub && rm -rf .git
          { echo "mictest run ${{ github.run_number }}"; tail -n 300 "$GITHUB_WORKSPACE/mictest.log" 2>/dev/null; } > build.log.txt
          git init -q && git checkout -q -b build-log-mictest
          git add . && git -c user.name=rubi-ci -c user.email=ci@rubi.local commit -q -m "mictest log"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-log-mictest || true
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: rubi-mictest
          path: upstream/build/merged-binary.bin
          if-no-files-found: error
