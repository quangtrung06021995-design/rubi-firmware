name: Deploy Rubi relay (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - relay/**
      - .github/workflows/relay.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        shell: bash
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "::error::Missing GitHub secrets CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Deploy Worker
        shell: bash
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npm i --no-save wrangler@4 2>&1 | tail -3
          npx wrangler deploy 2>&1 | tee ../deploy.log
          HOST=$(grep -oE '[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.workers\.dev' ../deploy.log | head -1)
          if [ -z "$HOST" ]; then
            echo "::error::Could not find the workers.dev address in the deploy output. Create the workers.dev subdomain first (Workers & Pages in the Cloudflare dashboard)."
            exit 1
          fi
          echo "RELAY_HOST=$HOST" >> "$GITHUB_ENV"

      - name: Check the relay answers
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://$RELAY_HOST/health" | grep -q "Rubi relay OK"; then echo "relay is up"; exit 0; fi
            sleep 10
          done
          echo "::error::The relay does not answer at https://$RELAY_HOST/health"
          exit 1

      - name: Publish relay address (branch relay-cfg)
        shell: bash
        run: |
          mkdir -p /tmp/relaycfg && cd /tmp/relaycfg && rm -rf .git
          printf '{"host":"%s"}\n' "$RELAY_HOST" > relay.json
          cat relay.json
          git init -q && git checkout -q -b relay-cfg
          git add . && git -c user.name=rubi-ci -c user.email=ci@rubi.local commit -q -m "relay address"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" relay-cfg
