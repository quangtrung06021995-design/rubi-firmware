name: Build Rubi C3 Zero firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - c3zero/rubi_c3zero/**
      - .github/workflows/c3zero.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        shell: bash
        run: |
          VER="1.0.${{ github.run_number }}"
          sed -i "s/^const char\* FW_VERSION    = \"[^\"]*\";/const char* FW_VERSION    = \"$VER\";/" c3zero/rubi_c3zero/rubi_c3zero.ino
          grep -n "FW_VERSION    =" c3zero/rubi_c3zero/rubi_c3zero.ino
          echo "C3_VERSION=$VER" >> "$GITHUB_ENV"

      - uses: arduino/setup-arduino-cli@v2

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit NeoPixel"
          arduino-cli compile --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc --export-binaries --output-dir out c3zero/rubi_c3zero
          ls -la out

      - name: Publish OTA files (branch ota-c3zero)
        shell: bash
        run: |
          mkdir -p /tmp/otapub && cd /tmp/otapub && rm -rf .git
          cp "$GITHUB_WORKSPACE/out/rubi_c3zero.ino.bin" c3zero.bin
          MD5=$(md5sum c3zero.bin | cut -d' ' -f1)
          SIZE=$(stat -c %s c3zero.bin)
          printf '{"version":"%s","url":"https://raw.githubusercontent.com/%s/ota-c3zero/c3zero.bin","md5":"%s","size":%s}\n' "$C3_VERSION" "${{ github.repository }}" "$MD5" "$SIZE" > manifest.json
          cat manifest.json; ls -la
          git init -q && git checkout -q -b ota-c3zero
          git add . && git -c user.name=rubi-ci -c user.email=ci@rubi.local commit -q -m "C3 Zero OTA $C3_VERSION"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ota-c3zero

      - uses: actions/upload-artifact@v4
        with:
          name: rubi-c3zero-firmware
          path: out/*.bin
